engineStrict: true

managePackageManagerVersions: false

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@stellar/stellar-sdk'
  - '@swc/core'
  - bigint-buffer
  - blake-hash
  - bufferutil
  - core-js-pure
  - esbuild
  - node-hid
  - protobufjs
  - puppeteer
  - secp256k1
  - sharp
  - tiny-secp256k1
  - unrs-resolver
  - usb
  - utf-8-validate

overrides:
  # @cprussin/jest-config peers on next@^15, which makes pnpm auto-install a
  # vulnerable next@15 into packages that don't use Next. Pin it to our catalog.
  '@cprussin/jest-config>next': 'catalog:'
  # Adapters must share one BaseWalletAdapter class, or TS rejects them
  # (protected members are nominal). Keep everything on the catalog pin.
  '@solana/wallet-adapter-base': 'catalog:'

packageManagerStrict: true

packageManagerStrictVersion: true

patchedDependencies:
  '@ledgerhq/errors': patches/@ledgerhq__errors.patch
  '@ledgerhq/hw-transport-node-hid': patches/@ledgerhq__hw-transport-node-hid.patch

strictDepBuilds: true

strictPeerDependencies: false
